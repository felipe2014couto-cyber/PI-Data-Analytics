[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends in argument defaults
    "BLE001",  # Blind exception (acceptable in cleanup/error handling)
    "SIM102",  # Nested if statements (style preference)
    "SIM105",  # contextlib.suppress (style preference)
    "UP007",   # X | Y union type (Pydantic v2 compatible)
    "RUF003",  # Ambiguous character in comments
    "RUF005",  # Iterable unpacking (style preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "RUF013",  # Implicit Optional in tests
    "RUF059",  # Unpacked variable
    "F841",    # Unused variable in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
